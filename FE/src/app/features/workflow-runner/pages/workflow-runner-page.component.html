<section class="p-2 sm:p-4">
  <article class="mx-auto max-w-4xl rounded-2xl border border-zinc-200 bg-white p-5 shadow-md shadow-slate-200/70 sm:p-7">
    <div class="flex flex-wrap items-start justify-between gap-3">
      <div>
        <h2 class="text-xl font-semibold text-slate-900">Workflow Runner</h2>
        <p class="mt-1 text-sm text-slate-600">Select service and test case file, then execute n8n workflow webhook.</p>
      </div>
      <div class="flex items-center gap-3">
        <span class="rounded-full px-3 py-1 text-xs font-semibold uppercase tracking-[0.14em]" [class]="statusBadgeClass()">
          {{ status() }}
        </span>
        <span class="rounded-lg border border-slate-200 bg-slate-50 px-2.5 py-1 font-mono text-xs text-slate-700">
          {{ formattedElapsedTime() }}
        </span>
      </div>
    </div>

    <div class="mt-6 grid gap-5 md:grid-cols-2">
      <label class="block">
        <span class="mb-2 inline-flex items-center gap-2 text-sm font-medium text-slate-700">
          <svg class="h-4 w-4 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 18h16"></path>
            <path d="M4 12h16"></path>
            <path d="M4 6h16"></path>
          </svg>
          Service
        </span>
        <select class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-900 outline-none transition hover:border-slate-300 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 disabled:cursor-not-allowed disabled:bg-slate-100" [value]="selectedService()" [disabled]="isServiceSelectionDisabled()" (change)="onServiceChange($event)">
          @for (service of serviceOptions(); track service.value) {
            <option [value]="service.value">{{ service.label }}</option>
          }
        </select>
      </label>

      <div class="block">
        <span class="mb-2 inline-flex items-center gap-2 text-sm font-medium text-slate-700">
          <svg class="h-4 w-4 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <path d="M14 2v6h6"></path>
          </svg>
          Choose File
        </span>
        <input #testCaseFileInput type="file" class="hidden" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" [disabled]="isFileSelectionDisabled()" (change)="onFileChange($event)" />

        <button type="button" class="w-full rounded-2xl border border-dashed px-4 py-6 text-left transition focus:outline-none focus:ring-2 focus:ring-indigo-100 disabled:cursor-not-allowed disabled:border-slate-200 disabled:bg-slate-100" [class.border-indigo-300]="isDragOverFile()" [class.bg-indigo-50]="isDragOverFile()" [class.border-slate-300]="!isDragOverFile()" [class.bg-slate-50]="!isDragOverFile()" [disabled]="isFileSelectionDisabled()" (click)="onFilePickerClick(testCaseFileInput)" (dragover)="onFileDragOver($event)" (dragleave)="onFileDragLeave($event)" (drop)="onFileDrop($event, testCaseFileInput)">
          @if (selectedFile()) {
            <div class="flex items-start justify-between gap-3">
              <div>
                <p class="text-sm font-medium text-slate-900">{{ selectedFileName() }}</p>
                <p class="mt-1 text-xs text-slate-500">Excel file ready for workflow execution.</p>
              </div>
              <span class="rounded-md border border-emerald-200 bg-emerald-50 px-2 py-1 text-xs font-medium text-emerald-700">Ready</span>
            </div>
          } @else {
            <div class="flex flex-col items-center justify-center gap-2 text-center">
              <svg class="h-10 w-10 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M20 17.58A5 5 0 0 0 18 8h-1.26A8 8 0 1 0 4 16.25"></path>
                <path d="m8 16 4-4 4 4"></path>
                <path d="M12 12v9"></path>
              </svg>
              <p class="text-sm font-medium text-slate-700">Drag and drop files here or click to select.</p>
              <p class="text-xs text-slate-500">Supports .xlsx only</p>
            </div>
          }
        </button>

        @if (selectedFile()) {
          <button type="button" class="mt-2 inline-flex items-center gap-1 rounded-lg border border-slate-200 px-2.5 py-1.5 text-xs text-slate-600 transition hover:border-slate-300 hover:text-slate-900" [disabled]="isFileSelectionDisabled()" (click)="clearSelectedFile(testCaseFileInput)">Clear file</button>
        }
      </div>
    </div>

    <div class="mt-6">
      <div class="mb-2 flex items-center justify-between text-xs font-medium uppercase tracking-[0.14em] text-slate-500">
        <span>Progress</span>
        <span>{{ progressPercent() }}%</span>
      </div>
      <div class="h-2.5 overflow-hidden rounded-full bg-slate-200">
        <div class="h-full rounded-full bg-gradient-to-r from-indigo-500 to-emerald-500 transition-all duration-500" [style.width.%]="progressPercent()"></div>
      </div>
    </div>

    <div class="mt-4">
      <mat-divider></mat-divider>
    </div>

    <div class="mt-6 flex flex-wrap justify-end gap-3">
      <button type="button" class="inline-flex items-center gap-2 rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-indigo-300" [disabled]="!canExecute()" (click)="executeWorkflow()">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
          <path d="m5 3 14 9-14 9z"></path>
        </svg>
        @if (status() === 'running') {
          Executing...
        } @else {
          Execute Workflow
        }
      </button>

      <button type="button" class="rounded-xl border border-slate-200 px-5 py-2.5 text-sm font-semibold text-slate-700 transition hover:border-slate-300 hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-50" [disabled]="!canViewReport()" (click)="openReport()">View Report</button>

      <button type="button" class="rounded-xl border border-slate-200 px-5 py-2.5 text-sm font-semibold text-slate-600 transition hover:border-slate-300 hover:bg-slate-50" (click)="reset(testCaseFileInput)">Reset</button>
    </div>

    @if (executionError()) {
      <div class="mt-4 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700">
        {{ executionError() }}
      </div>
    }
  </article>
</section>
