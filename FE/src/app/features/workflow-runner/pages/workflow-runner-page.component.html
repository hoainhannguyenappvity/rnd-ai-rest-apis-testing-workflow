<section class="grid gap-5 lg:grid-cols-[1.1fr,0.9fr]">
  <article
    class="rounded-2xl border border-slate-800 bg-slate-900/70 p-5 shadow-xl shadow-slate-950/50"
  >
    <div class="flex flex-wrap items-center justify-between gap-3">
      <h2 class="text-lg font-semibold text-white">Workflow Runner</h2>
      <div class="flex items-center gap-3">
        <span
          class="rounded-full px-3 py-1 text-xs font-semibold uppercase tracking-[0.16em]"
          [class]="statusBadgeClass()"
        >
          {{ status() }}
        </span>
        <span class="font-mono">{{ formattedElapsedTime() }}</span>
      </div>
    </div>

    <p class="mt-2 text-sm text-slate-400">Select service, then execute n8n workflow webhook.</p>

    <div class="mt-5 grid gap-4 sm:grid-cols-2">
      <label class="block">
        <span class="mb-2 block text-xs font-medium uppercase tracking-[0.16em] text-slate-400"
          >Service</span
        >
        <select
          class="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none transition focus:border-cyan-400"
          [value]="selectedService()"
          [disabled]="isServiceSelectionDisabled()"
          (change)="onServiceChange($event)"
        >
          <option value="ups">ups</option>
          <option value="numbering">numbering</option>
        </select>
      </label>

      <div class="block">
        <span class="mb-2 block text-xs font-medium uppercase tracking-[0.16em] text-slate-400"
          >Choose File</span
        >
        <input
          #testCaseFileInput
          type="file"
          class="block w-full cursor-pointer rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 file:mr-3 file:rounded-lg file:border-0 file:bg-cyan-400 file:px-3 file:py-1.5 file:font-semibold file:text-slate-950 hover:file:brightness-110"
          accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
          [disabled]="isFileSelectionDisabled()"
          (change)="onFileChange($event)"
        />
        @if (selectedFile()) {
          <div class="mt-2 flex items-center justify-between gap-2 text-xs text-slate-300">
            <span class="truncate">{{ selectedFile()?.name }}</span>
            <button
              type="button"
              class="rounded-md border border-slate-600 px-2 py-1 text-slate-300 transition hover:border-slate-400 hover:text-white"
              [disabled]="isFileSelectionDisabled()"
              (click)="clearSelectedFile(testCaseFileInput)"
            >
              Clear
            </button>
          </div>
        }
      </div>
    </div>

    <div class="mt-5">
      <div
        class="mb-2 flex items-center justify-between text-xs uppercase tracking-[0.16em] text-slate-400"
      >
        <span>Progress</span>
        <div class="flex items-center gap-3">
          <!-- <span class="font-mono">{{ formattedElapsedTime() }}</span> -->
          <span>{{ progressPercent() }}%</span>
        </div>
      </div>
      <div class="h-2 overflow-hidden rounded-full bg-slate-800">
        <div
          class="h-full rounded-full bg-gradient-to-r from-cyan-400 to-blue-500 transition-all duration-500"
          [style.width.%]="progressPercent()"
        ></div>
      </div>
    </div>

    <div class="mt-6 flex flex-wrap gap-3">
      <button
        type="button"
        class="rounded-xl bg-gradient-to-r from-cyan-400 to-blue-500 px-5 py-2.5 text-sm font-semibold text-slate-950 transition hover:brightness-110 disabled:cursor-not-allowed disabled:opacity-40"
        [disabled]="!canExecute()"
        (click)="executeWorkflow()"
      >
        @if (status() === 'running') {
          Executing...
        } @else {
          Execute Workflow
        }
      </button>

      <button
        type="button"
        class="rounded-xl border border-cyan-500/40 px-5 py-2.5 text-sm font-semibold text-cyan-200 transition hover:border-cyan-300 hover:text-cyan-100 disabled:cursor-not-allowed disabled:opacity-40"
        [disabled]="!canViewReport()"
        (click)="openReport()"
      >
        View Report
      </button>

      <button
        type="button"
        class="rounded-xl border border-slate-600 px-5 py-2.5 text-sm font-semibold text-slate-300 transition hover:border-slate-400 hover:text-white"
        (click)="reset(testCaseFileInput)"
      >
        Reset
      </button>
    </div>

    @if (executionError()) {
      <div
        class="mt-4 rounded-xl border border-rose-500/40 bg-rose-500/10 px-3 py-2 text-sm text-rose-200"
      >
        {{ executionError() }}
      </div>
    }
  </article>
</section>
